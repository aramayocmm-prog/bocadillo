name: Build APK

on:
  push:
  workflow_dispatch:   # botón "Run workflow" en la pestaña Actions (también desde el móvil)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas del núcleo
        run: |
          chmod +x gradlew
          ./gradlew :core:model:test :core:imaging:test --stacktrace

      - name: Compilar APK de depuración
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: bocadillo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Subir resultados de pruebas (también si fallan)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/*/build/reports/tests/
            core/imaging/build/visual/
