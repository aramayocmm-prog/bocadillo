name: Build APK

on:
  push:
  workflow_dispatch:   # botón "Run workflow" en la pestaña Actions (también desde el móvil)

permissions:
  contents: write   # publishes the APK of main to the "apk-output" branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas del núcleo
        run: |
          chmod +x gradlew
          ./gradlew :core:model:test :core:imaging:test --stacktrace

      - name: Compilar APK de depuración
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: bocadillo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar APK en la rama apk-output (solo main)
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          mkdir -p /tmp/apk && cp app/build/outputs/apk/debug/*.apk /tmp/apk/Bocadillo-debug.apk
          cd /tmp/apk
          git init -q -b apk-output
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          echo "APK de depuración del commit ${GITHUB_SHA}" > README.md
          git add -A && git commit -qm "APK for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-output

      - name: Subir resultados de pruebas (también si fallan)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/*/build/reports/tests/
            core/imaging/build/visual/
