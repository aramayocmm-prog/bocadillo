name: Capturas de pantalla

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # publishes the captures to the "screens-output" branch

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compilar pruebas
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Compilar la version 1.1.0 (prueba de actualizacion)
        if: hashFiles('tools/ci-quick.txt') == ''
        run: |
          git fetch --depth 1 origin backup-1.1.0-before-1.2
          git worktree add ../old FETCH_HEAD
          cd ../old && chmod +x gradlew && ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -q
          ls -la app/build/outputs/apk/debug/ app/build/outputs/apk/androidTest/debug/
      - name: Emulador y capturas
        timeout-minutes: 105
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/ci-emulator.sh
      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: |
            screens/
            results.txt
            crash.txt
            app/build/reports/androidTests/
      - name: Publicar capturas en la rama screens-output
        if: always()
        run: |
          set -e
          [ -d screens/files/screens ] || [ -f results.txt ] || exit 0
          mkdir -p /tmp/out && cp screens/files/screens/* /tmp/out/ 2>/dev/null || true
          cp results.txt crash.txt /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b screens-output
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          echo "Capturas del emulador del commit ${GITHUB_SHA}" > README.md
          git add -A && git commit -qm "Captures for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screens-output
