name: Capturas de pantalla

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # publishes the captures to the "screens-output" branch

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compilar pruebas
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Emulador y capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell settings put global hide_error_dialogs 1
            ./gradlew :app:installDebug :app:installDebugAndroidTest --stacktrace
            mkdir -p screens/files/screens
            for t in app.bocadillo.ReferenceScreensTest app.bocadillo.StickerLibraryFlowTest app.bocadillo.MacFlowsTest#largePictureAsksForSize app.bocadillo.MacFlowsTest#homeTitleAndPaint app.bocadillo.MacFlowsTest#insertedPictureSkewPerspectiveSaveReopenExport app.bocadillo.MacFlowsTest#svgShapeAndLineStyle; do echo "=== $t" >> results.txt; adb logcat -c; timeout 420 adb shell am instrument -w -r -e class "$t" app.bocadillo.debug.test/androidx.test.runner.AndroidJUnitRunner >> results.txt 2>&1 || echo "TIMEOUT_OR_ERROR $t" >> results.txt; adb logcat -b crash -d >> crash.txt 2>/dev/null; adb logcat -d -t 400 '*:E' >> errors.txt 2>/dev/null; done
            adb exec-out run-as app.bocadillo.debug tar c files/screens > screens/screens.tar || true
            cd screens && tar xf screens.tar && rm screens.tar; cd ..
            mkdir -p screens/files/screens
            cp results.txt crash.txt errors.txt screens/files/screens/ 2>/dev/null || true
            grep -q 'TIMEOUT_OR_ERROR\|FAILURES!!!\|INSTRUMENTATION_FAILED\|Process crashed' results.txt && touch test_failed || true
            test ! -f test_failed
      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: |
            screens/
            app/build/reports/androidTests/
      - name: Publicar capturas en la rama screens-output
        if: always()
        run: |
          set -e
          [ -d screens/files/screens ] || exit 0
          mkdir -p /tmp/out && cp screens/files/screens/* /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b screens-output
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          echo "Capturas del emulador del commit ${GITHUB_SHA}" > README.md
          git add -A && git commit -qm "Captures for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screens-output
